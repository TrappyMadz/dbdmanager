[project]
name = "dbdmanager-backend"
version = "0.1.0"
description = "The backend of the dbdmanager project."
readme = "README.md"
authors = [
    { name = "TrappyMadz", email = "simon.charrier42@outlook.fr" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.46",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
dbdmanager-backend = "dbdmanager_backend:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
link-mode = "copy"
